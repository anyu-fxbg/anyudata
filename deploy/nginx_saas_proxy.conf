# ============================================================
#  gemidaojia.com 反向代理 SaaS 平台（同源，已在 218 本机落地）
#  作用：把平台挂在 https://www.gemidaojia.com/saas 下，复用本站 HTTPS 证书。
#  实测结论：gemidaojia.com 的 nginx 就在 218.201.234.118 本机（证书 big-data），
#           且 gunicorn/node 只绑 127.0.0.1，因此 proxy_pass 必须用 127.0.0.1
#           （用公网 IP 反而连不通）。
#
#  落地方式（宝塔安全，避免改主 vhost 被面板覆盖）：
#    写入 /www/server/panel/vhost/nginx/extension/big-data/saas_proxy.conf
#    （node_big-data.conf 第 10 行已 include 该目录 *.conf）
#    然后 nginx -t && nginx -s reload
#
#  路由（关键：/saas/api/ 必须映射成后端 /api/，否则 404）：
#   - /saas/api/  → SaaS 后端 Django（/saas/api/* 去掉 /saas 前缀 → /api/*）
#   - /saas/      → SaaS 前端 Nuxt（保留 /saas，前端 baseURL=/saas/）
#   - 微信回调 /saas/api/billing/order/wechat/notify/ 自动走 api 规则
#   - 用 ^~ 优先于主 vhost 的敏感目录正则块，且不影响原 location /（127.0.0.1:3000）
# ============================================================

location ^~ /saas/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /saas/ {
    proxy_pass http://127.0.0.1:3001/saas/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
